# Your profile. The radar compares every job against this.
# Skill keys must exist in radar/skills.py (e.g. aws, kubernetes, terraform, cert_k8s).

name: Ahmed Al-Saeed
headline: Cloud & DevOps Engineer, 2 years production, AWS SAA, VCP-DCV

skills:
  # Used in production at work (counts 100%)
  strong:
    - aws
    - cert_aws
    - linux
    - rhel
    - suse
    - windows_server
    - vmware
    - cert_vmware
    - proxmox
    - virtualization
    - ha_clustering
    - sap_hana
    - prometheus
    - grafana
    - zabbix
    - veeam
    - backup_dr
    - firewalls
    - networking
    - haproxy
    - nginx
    - apache
    - iis
    - mongodb
    - redis
    - bash
  # Used in projects / training only (counts 60%, shown as "project level")
  familiar:
    - docker
    - kubernetes
    - terraform
    - ansible
    - jenkins
    - github_actions
    - cicd
    - git
    - python
    - azure
    - openstack
    - devsecops
    - mysql
    - storage
    - incident

filters:
  regions: [egypt, remote, gulf, europe]
  include_senior: false              # true = also show Senior titles
  max_years_required: 4              # hide jobs asking for more than this
  europe_requires_sponsorship: true  # hide Europe jobs that say "no visa sponsorship"
  max_age_days: 30                   # hide jobs posted more than this many days ago

# Keywords used to build the LinkedIn / Wuzzuf / Bayt search links on the site
search:
  keywords:
    - DevOps Engineer
    - Cloud Engineer
    - Infrastructure Engineer
    - System Administrator
    - Systems Engineer
    - Site Reliability Engineer
    - SAP HANA Administrator

  # LinkedIn POSTS search (recruiter / HR "we are hiring" posts).
  # Keep these short and plain: LinkedIn post search returns nothing for long OR/AND queries.
  # Each link searches: hiring <role> <place>
  post_roles:
    DevOps: 'DevOps'
    Cloud: 'Cloud Engineer'
    Infrastructure: 'Infrastructure Engineer'
    System Admin: 'System Administrator'
    System Engineer: 'System Engineer'
    SRE / Platform: 'SRE'
    Linux: 'Linux'
    SAP HANA: 'SAP Basis'
  post_places:
    مصر: 'Egypt'
    القاهرة: 'Cairo'
    الإمارات: 'UAE'
    السعودية: 'Saudi'
    قطر: 'Qatar'
    ريموت: 'remote'
    Relocation: 'relocation'
