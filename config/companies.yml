# Companies and job boards the radar checks every day.
#
# How to add a company (one entry):
#   - name: Company Name
#     slugs: [companyname]        # the word in its careers URL, e.g. jobs.lever.co/<slug>
#     regions: [egypt]            # where you expect its jobs: egypt / gulf / europe / remote
#
# The radar tries Greenhouse, Lever, Ashby, Workable, SmartRecruiters and Recruitee
# automatically and remembers which one worked (state/detected_ats.json).
# If you know the system, pin it:  ats: greenhouse   (faster, no guessing)
# Companies on Workday:           workday_url: https://<tenant>.wd1.myworkdayjobs.com/<Site>
# Companies with no public feed:  link: true   (the site builds a LinkedIn jobs search for it)
#                                 career_url: https://...   (optional: official careers page)
# Any company whose automatic fetch fails also shows up as a LinkedIn link.
#
# The "Sources" tab on the site shows which entries worked on the last run.

job_boards:
  - id: arbeitnow        # Europe, many English + visa-sponsorship jobs
  - id: arbeitnow_uk     # United Kingdom
  - id: remotive         # remote jobs
  - id: remoteok         # remote jobs
  - id: himalayas        # remote jobs open to Egypt

