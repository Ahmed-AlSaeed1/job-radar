name: Update jobs

on:
  schedule:
    - cron: "0 4 * * *"      # every day 04:00 UTC = 06:00-07:00 Cairo time
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write             # to commit the new jobs.json
  pages: write                # to publish the site
  id-token: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test the filters
        run: python -m pytest -q tests

      - name: Fetch and analyze jobs
        run: python -m radar.run

      - name: Save data in the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json state/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update jobs $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
